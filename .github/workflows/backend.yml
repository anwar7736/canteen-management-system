name: Backend CI/CD

# Tests run on every change to backend/ (pushes and pull requests).
# A push to main that passes the tests is deployed to the droplet.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, intl, pdo_sqlite, sqlite3, gd, zip, exif
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
        # site-deploy on the droplet reads /etc/site-deploy/canteen-api.conf: pulls main, composer install,
        # migrate, caches, reloads php-fpm, checks the site and rolls the code back when it is not healthy
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$HOST" "sudo -n /usr/local/sbin/site-deploy canteen-api"
